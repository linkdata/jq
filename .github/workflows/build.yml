name: Build

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - "stable"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Go generate
        run: go generate ./...

      - name: Test
        run: go test -tags debug -bench=. -coverprofile=coverage.out ./...

      - name: Fuzz smoke
        run: |
          go test ./... -run=^$ -fuzz=FuzzGet_NoPanicAndErrorContract -fuzztime=5s
          go test ./... -run=^$ -fuzz=FuzzSet_NoPanicIdempotent -fuzztime=5s
          go test ./... -run=^$ -fuzz=FuzzSetChecked_AtomicCallbackContract -fuzztime=5s
          go test ./... -run=^$ -fuzz=FuzzSet_InvalidReceiverContract -fuzztime=3s

      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.23.0
        with:
          args: ./...

      - name: Build
        run: go build .

      - name: Coverage
        id: coverage
        run: |
          echo "COVERAGE=$(go tool cover -func=coverage.out | tail -n 1 | tr -s '\t' | cut -f 3)" >> $GITHUB_OUTPUT
          go tool cover -html=coverage.out -o=coveragereport.html.out

      - name: Publish badge (and optional report)
        uses: linkdata/gitcoverage@v7
        with:
          coverage: ${{ steps.coverage.outputs.coverage }}
          report:   "coveragereport.html.out"
